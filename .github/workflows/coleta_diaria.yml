name: Rotina Diária de Inteligência - Sorgo

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  atualizar_radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - run: pip install pandas feedparser google-genai pydantic
      
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python robo_coleta.py
        
- run: |
          git config --global user.name "Robô Agro (GitHub Actions)"
          git config --global user.email "bot-radar@agronegocio.com"
          git rm -f noticias_sorgo.csv
          git commit -m "🧹 Limpeza temporária para atualização" || true
          git pull origin main --rebase
          git add noticias_sorgo.csv
          git commit -m "🤖 Atualização diária do radar [$(date +'%d-%m-%Y')]" || exit 0
          git push
